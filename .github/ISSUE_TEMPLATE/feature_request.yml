name: Feature request
description: Suggest an improvement or a new capability for the container or its tools
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the workflow that is currently awkward or impossible.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to happen, concretely.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, or other designs you considered.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This fits the repo's scope (Android build environment, phone tooling, local AI tooling).
